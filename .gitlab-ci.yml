    DOCKER_SLIM: enable
    ENABLE_NODEJS_INTEGRATION_TEST: 'true'
    NODEJS_INTEGRATION_TEST_IMAGE_VERSION: registry.nexdev.net:5050/docker/node:14.15.1-slim
    NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION: registry.nexdev.net:5050/docker/database/mongo:4.4.8
  
include:
    - project: "ci/repos-ci/pentagon_l1_turbo_big_small_service"
      ref: master
